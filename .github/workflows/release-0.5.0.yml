name: Release 0.5.0 Migration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Release-Branch auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Firmware und Dokumentation aktualisieren
        shell: python
        run: |
          from pathlib import Path

          main = Path("src/main.cpp")
          text = main.read_text(encoding="utf-8")
          text = text.replace(
              "#define ARDUINO_OBI_VERSION_MAJOR 0\n#define ARDUINO_OBI_VERSION_MINOR 4\n#define ARDUINO_OBI_VERSION_PATCH 4",
              "#define ARDUINO_OBI_VERSION_MAJOR 0\n#define ARDUINO_OBI_VERSION_MINOR 5\n#define ARDUINO_OBI_VERSION_PATCH 0",
          )
          text = text.replace(
              "BatteryData battery;\nbool access_point_mode = false;\nString access_point_name;",
              "BatteryData battery;\nbool access_point_mode = false;\nString access_point_name;\nstatic const unsigned long WIFI_FALLBACK_TIMEOUT_MS = 60000;\nunsigned long wifi_disconnected_since = 0;",
          )
          marker = "void setup_web_server() {"
          monitor = '''void monitor_wifi_connection() {
          #ifdef OBI_WOKWI_WIFI
              return;
          #else
              if (access_point_mode) {
                  return;
              }

              if (WiFi.status() == WL_CONNECTED) {
                  wifi_disconnected_since = 0;
                  return;
              }

              if (wifi_disconnected_since == 0) {
                  wifi_disconnected_since = millis();
                  Serial.println("WLAN-Verbindung verloren. Setup-Fallback startet nach 60 Sekunden.");
                  return;
              }

              if (millis() - wifi_disconnected_since >= WIFI_FALLBACK_TIMEOUT_MS) {
                  Serial.println("WLAN weiterhin nicht erreichbar. Setup-Access-Point wird gestartet.");
                  start_access_point();
                  wifi_disconnected_since = 0;
              }
          #endif
          }

          '''
          if "void monitor_wifi_connection()" not in text:
              text = text.replace(marker, monitor + marker)
          text = text.replace(
              "void loop() {\n    server.handleClient();\n    delay(2);\n}",
              "void loop() {\n    server.handleClient();\n    monitor_wifi_connection();\n    delay(2);\n}",
          )
          main.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace("Firmware-v0.4.4-blue", "Firmware-v0.5.0-blue")
          text = text.replace("Aktuelle Firmware: **0.4.4**", "Aktuelle Firmware: **0.5.0**")
          text = text.replace(
              "- WLAN-Ersteinrichtung über einen eigenen Setup-Access-Point\n",
              "- WLAN-Ersteinrichtung über einen eigenen Setup-Access-Point\n- Automatischer Setup-Fallback bei längerem WLAN-Ausfall\n",
          )
          fallback = '''## Automatischer WLAN-Fallback

Kann OBI-C3 beim Start keine Verbindung zum gespeicherten WLAN herstellen, wird automatisch der Setup-Access-Point geöffnet.

Bricht eine bereits bestehende WLAN-Verbindung ab und bleibt länger als **60 Sekunden** unterbrochen, startet OBI-C3 ebenfalls automatisch den Setup-Access-Point:

```text
WLAN: OBI-Setup-XXXXXX
Passwort: obi-setup
Adresse: http://192.168.4.1
```

Die gespeicherten WLAN-Zugangsdaten werden dabei nicht gelöscht. Über die Setup-Weboberfläche können neue Zugangsdaten gespeichert werden. Nach dem Speichern startet OBI-C3 neu und verbindet sich mit dem ausgewählten WLAN.

'''
          if "## Automatischer WLAN-Fallback" not in text:
              text = text.replace("## WLAN-Konfiguration löschen\n", fallback + "## WLAN-Konfiguration löschen\n")
          text = text.replace('git commit -m "Release v0.4.5"', 'git commit -m "Release v0.5.1"')
          text = text.replace("git tag v0.4.5", "git tag v0.5.1")
          text = text.replace("git push origin v0.4.5", "git push origin v0.5.1")
          readme.write_text(text, encoding="utf-8")

          ota = Path("docs/WEB_OTA.md")
          text = ota.read_text(encoding="utf-8")
          text = text.replace(
              "#define ARDUINO_OBI_VERSION_MAJOR 0\n#define ARDUINO_OBI_VERSION_MINOR 4\n#define ARDUINO_OBI_VERSION_PATCH 4",
              "#define ARDUINO_OBI_VERSION_MAJOR 0\n#define ARDUINO_OBI_VERSION_MINOR 5\n#define ARDUINO_OBI_VERSION_PATCH 0",
          )
          text = text.replace('git commit -m "Release v0.4.5"', 'git commit -m "Release v0.5.1"')
          text = text.replace("git tag v0.4.5", "git tag v0.5.1")
          text = text.replace("git push origin v0.4.5", "git push origin v0.5.1")
          text = text.replace("beispielsweise `v0.4.5`", "beispielsweise `v0.5.1`")
          text = text.replace("wie `0.4.5`", "wie `0.5.1`")
          text = text.replace("zum Beispiel `v0.4.5`", "zum Beispiel `v0.5.1`")
          ota.write_text(text, encoding="utf-8")

      - name: Änderungen in Release-Branch pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp README.md docs/WEB_OTA.md
          git commit -m "Release v0.5.0: automatischer WLAN-Fallback"
          git push origin HEAD:${{ github.head_ref }}

  tag-release:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Release v0.5.0')
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release-Tag erstellen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag v0.5.0
          git push origin v0.5.0
