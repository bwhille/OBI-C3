[platformio]
default_envs = esp32-c3-web

[env:uno]
platform = atmelavr
board = uno
framework = arduino

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
board_build.mcu = atmega328p
board_build.f_cpu = 16000000L

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
framework = arduino

build_flags =
  -DESP_BUILD=1
  -DESP_EN_PIN=0
  -DESP_OW_PIN=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_TINYUSB=1
  -DCORE_DEBUG_LEVEL=3

monitor_speed = 115200
monitor_filters =
  esp32_exception_decoder
  time

[env:esp32-c3-web]
extends = env:esp32-c3-devkitm-1

build_flags =
  ${env:esp32-c3-devkitm-1.build_flags}
  -DOBI_WEB_BUILD=1

lib_deps =
  bblanchon/ArduinoJson @ ^7.0.0
